name: Monitor concursos

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (horário UTC, não importa para intervalos)
  workflow_dispatch:          # permite rodar manualmente pela aba Actions

permissions:
  contents: write             # necessário para salvar o concursos_state.json

concurrency:
  group: monitor-concursos    # evita duas execuções ao mesmo tempo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install beautifulsoup4

      - name: Rodar o monitor
        run: python monitor_concursos.py --once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salvar estado para a próxima execução
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add concursos_state.json
          git diff --staged --quiet || (git commit -m "atualiza estado dos concursos" && git push)
